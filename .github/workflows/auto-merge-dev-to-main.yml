name: Auto Merge Dev to Main

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  enable-auto-merge:
    if: github.event_name == 'push' || (github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main dev
          if git diff --quiet origin/main...origin/dev; then
            echo "main and dev have no changes to merge."
            exit 0
          fi
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head dev --title 'Merge dev into main' --body 'Automated development branch promotion.')"
            pr_number="${pr_url##*/}"
          fi
          gh pr merge "$pr_number" --auto --merge --repo "$GITHUB_REPOSITORY"
