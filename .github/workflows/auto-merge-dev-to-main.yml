name: Auto Merge Dev to Main

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  enable-auto-merge:
    if: github.event_name == 'push' || (github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch origin main dev
            if git diff --quiet origin/main...origin/dev; then
              echo "main and dev have no changes to merge."
              exit 0
            fi
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')"
            if [ -z "$pr_number" ]; then
              create_output=""
              if ! create_output="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head dev --title 'Merge dev into main' --body 'Automated development branch promotion.' 2>&1)"; then
                if ! printf '%s' "$create_output" | grep -Eq 'No commits between|already exists'; then
                  printf '%s\n' "$create_output" >&2
                  exit 1
                fi
                create_output=""
              fi
              pr_url="$create_output"
              pr_number="${pr_url##*/}"
              if [ -z "$pr_number" ]; then
                pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')"
              fi
            fi
          else
            pr_number="$PR_NUMBER"
          fi
          [ -n "$pr_number" ] || { echo "No open dev to main PR."; exit 0; }
          gh pr merge "$pr_number" --auto --merge --repo "$GITHUB_REPOSITORY"
